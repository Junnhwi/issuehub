name: Ingest

on:
  schedule:
    - cron: "41 * * * *" # 예비. 주 실행은 Supabase pg_cron이 매시 20분에 workflow_dispatch로 요청(0005 마이그레이션)
  workflow_dispatch:
    inputs:
      source:
        description: "특정 소스 slug만 수집 (비우면 전체)"
        required: false
        default: ""
      skip_summarize:
        description: "AI 요약 단계를 건너뜀"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      INGEST_BATCH_LIMIT: ${{ vars.INGEST_BATCH_LIMIT || '30' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Check required secrets
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SECRET_KEY 시크릿이 없습니다. 저장소 Settings → Secrets and variables → Actions 에 등록하세요."
            exit 1
          fi

      - name: Ingest
        run: npm run ingest -- ${{ inputs.source && format('--source={0}', inputs.source) || '' }}

      - name: AI summarize
        if: ${{ !inputs.skip_summarize }}
        env:
          AI_SUMMARIZATION_ENABLED: ${{ vars.AI_SUMMARIZATION_ENABLED || 'false' }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          AI_SUMMARY_BATCH_LIMIT: ${{ vars.AI_SUMMARY_BATCH_LIMIT || '40' }}
          AI_MONTHLY_REQUEST_CAP: ${{ vars.AI_MONTHLY_REQUEST_CAP || '3000' }}
        run: npm run summarize
